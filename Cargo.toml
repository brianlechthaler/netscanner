[workspace]
members = ["crates/netscanner-core", "crates/netscanner-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Brian Lechthaler <https://github.com/brianlechthaler>"]
repository = "https://github.com/brianlechthaler/netscanner"
homepage = "https://github.com/brianlechthaler/netscanner"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
